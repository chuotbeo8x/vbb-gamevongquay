<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>VBB Game Vòng Quay 2026 – Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#071c45}body{display:flex;align-items:center;justify-content:center;padding:18px;gap:22px}.phone{position:relative;width:min(375px,calc(100vw - 28px));aspect-ratio:375/812;border-radius:22px;overflow:hidden;background:#168af4;box-shadow:0 24px 80px rgba(0,0,0,.48);flex:0 0 auto}.screen{position:absolute;inset:0;display:none;overflow:hidden;background:#168af4}.screen.active{display:block}.screen-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:9;padding:0}.hotspot:focus-visible{outline:2px solid #fff;outline-offset:-2px}.wheel-spin{position:absolute;left:31px;top:264px;width:314px;height:314px;z-index:6;display:none;pointer-events:none}.wheel-spin.active{display:block}.wheel-spin img{width:100%;height:100%;object-fit:contain;transform-origin:center}.wheel-spin.spinning img{animation:wheelSpin 2.8s cubic-bezier(.12,.72,.08,1) forwards}@keyframes wheelSpin{0%{transform:rotate(0)}18%{transform:rotate(520deg)}72%{transform:rotate(1720deg)}100%{transform:rotate(2185deg)}}.loading-bar{position:absolute;left:54px;top:751px;width:266px;height:27px;border-radius:20px;z-index:5;overflow:hidden;background:#003da7;border:2px solid #fff;box-shadow:0 0 0 2px #0065ff inset}.loading-bar span{display:block;height:100%;width:0;background:linear-gradient(#fff56a,#ffd923 45%,#ffb900);border-radius:16px;animation:loadFill 2.3s cubic-bezier(.18,.7,.2,1) forwards}@keyframes loadFill{to{width:100%}}.dev{width:230px;color:#eaf4ff;background:rgba(8,30,70,.88);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:15px;backdrop-filter:blur(12px);box-shadow:0 16px 50px rgba(0,0,0,.22)}.dev h3{font-size:14px;margin:0 0 10px}.dev p{font-size:12px;line-height:1.45;margin:0 0 12px;color:#bcd5f5}.dev button{width:100%;text-align:left;border:0;border-radius:9px;padding:8px 10px;margin:3px 0;background:#123b78;color:#fff;cursor:pointer;font-size:12px}.dev button.active{background:#0869d9}@media(max-width:700px){body{padding:0;display:block;background:#168af4}.phone{width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none}.dev{display:none}}
</style>
</head>
<body>
<div class="phone">
<section class="screen active" id="loading"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/49426d3c-2ff6-49af-b1f3-80d722d7ff82.png" alt="Loading"><div class="loading-bar"><span></span></div></section>
<section class="screen" id="home"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/fe4d0f7b-71bc-4d17-898b-0817467eae66.png" alt="Home"><div class="wheel-spin" id="wheelSpin"><img src="https://www.figma.com/api/mcp/asset/0e1833da-0211-46ce-b05a-c96d5f7c6524.png" alt=""></div><button class="hotspot" style="left:99px;top:647px;width:176px;height:78px" id="spinHot" aria-label="Quay"></button><button class="hotspot" style="left:26px;top:741px;width:101px;height:38px" data-go="rules"></button><button class="hotspot" style="left:137px;top:741px;width:101px;height:38px" data-go="missions"></button><button class="hotspot" style="left:248px;top:741px;width:101px;height:38px" data-go="gifts"></button></section>
<section class="screen" id="win"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/0b0398f4-d821-4ee4-a6ea-a554ef6216da.png" alt="Trúng quà"><button class="hotspot" style="left:157px;top:538px;width:62px;height:62px" data-go="home"></button></section>
<section class="screen" id="lucky1"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/357b237a-9705-4d1d-b9a9-99dc570880f6.png" alt="May mắn"><button class="hotspot" style="left:157px;top:486px;width:62px;height:62px" data-go="home"></button></section>
<section class="screen" id="lucky2"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/bceb8ee1-407b-4e44-b2cb-da234646e007.png" alt="May mắn 2"><button class="hotspot" style="left:157px;top:486px;width:62px;height:62px" data-go="home"></button></section>
<section class="screen" id="rules"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/71b7a4da-941f-4184-915d-a67637e698e0.png" alt="Thể lệ"><button class="hotspot" style="left:8px;top:55px;width:56px;height:56px" data-go="home"></button></section>
<section class="screen" id="gifts"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/49426d3c-2ff6-49af-b1f3-80d722d7ff82.png" alt="Túi quà"><div style="position:absolute;inset:120px 12px 55px;background:#fff;border-radius:18px;padding:18px;color:#005993;overflow:auto"><h2 style="margin:0 0 16px;font-size:20px">Túi Quà</h2><p>E-voucher 20.000 VND</p><p>E-voucher 50.000 VND</p><p>E-voucher 100.000 VND</p><p>E-voucher 200.000 VND</p></div><button class="hotspot" style="left:8px;top:55px;width:56px;height:56px" data-go="home"></button></section>
<section class="screen" id="missions"><img class="screen-shot" src="https://www.figma.com/api/mcp/asset/49426d3c-2ff6-49af-b1f3-80d722d7ff82.png" alt="Thêm lượt"><div style="position:absolute;inset:154px 17px 55px 8px;background:#fff;border-radius:12px;padding:18px;color:#005993"><h3 style="margin-top:0">Mở sổ Tiết kiệm Online hoặc tại Quầy</h3><p style="line-height:1.45">Mỗi lần thành công + lượt quay theo số tiền gửi tiết kiệm, tối đa 100 lượt/ngày.</p></div><button class="hotspot" style="left:8px;top:55px;width:56px;height:56px" data-go="home"></button></section>
</div>
<aside class="dev"><h3>Demo screens</h3><p>Tách từng màn, không chồng layer state lên nhau.</p><button data-devgo="loading">01 · Loading</button><button data-devgo="home">02 · Home</button><button data-devgo="win">03 · Trúng quà</button><button data-devgo="lucky1">04 · Chúc may mắn #1</button><button data-devgo="lucky2">05 · Chúc may mắn #2</button><button data-devgo="rules">06 · Thể lệ</button><button data-devgo="gifts">07 · Túi quà</button><button data-devgo="missions">08 · Thêm lượt</button></aside>
<script>
(()=>{const screens=[...document.querySelectorAll('.screen')],dev=[...document.querySelectorAll('[data-devgo]')];let idx=0,spinning=false;const order=['win','lucky1','lucky2'];function go(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));dev.forEach(b=>b.classList.toggle('active',b.dataset.devgo===id))}document.addEventListener('click',e=>{const el=e.target.closest('[data-go]');if(el)go(el.dataset.go)});dev.forEach(b=>b.addEventListener('click',()=>go(b.dataset.devgo)));document.getElementById('spinHot').addEventListener('click',()=>{if(spinning)return;spinning=true;const id=order[idx++%order.length],w=document.getElementById('wheelSpin');w.classList.remove('spinning');w.classList.add('active');void w.offsetWidth;w.classList.add('spinning');setTimeout(()=>{go(id);w.classList.remove('active','spinning');spinning=false},2920)});setTimeout(()=>{if(document.getElementById('loading').classList.contains('active'))go('home')},2400)})();
</script>
</body>
</html>
