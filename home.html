<!doctype html>
<html lang="vi">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>VBB Game Vòng Quay 2026 – Home</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="home.css?v=20260915_bg" />
  </head>

  <body class="home-page">
    <div class="phone" id="app">
      <div class="topbar">
        <button class="round-btn" id="backBtn" aria-label="Quay lại"><img src="assets/ic-back.svg" alt="" /></button>
        <img class="logo" src="assets/logo-vietbank.svg" alt="VietBank" />
        <button class="round-btn" id="soundBtn" aria-label="Âm thanh"><img id="soundIcon" src="assets/ic-speak.svg"
            alt="" /></button>
      </div>
      <img class="title" src="assets/text-main.png" alt="Tích lũy vui vui vi vu" />
      <div class="wheel-wrap">
        <div id="wheel" class="wheel">
          <img class="wheel-bg" src="assets/vong-quay-tron.png" alt="Vòng quay" />
          <div class="wheel-items" id="wheelItems">
            <div class="wheel-item"><img src="assets/item-20k.png" alt="20K" /></div>
            <div class="wheel-item"><img src="assets/iteam-la.png" alt="May mắn" /></div>
            <div class="wheel-item"><img src="assets/item-50k.png" alt="50K" /></div>
            <div class="wheel-item"><img src="assets/item-100k.png" alt="100K" /></div>
            <div class="wheel-item"><img src="assets/item-200k.png" alt="200K" /></div>
            <div class="wheel-item"><img src="assets/iteam-ngoisao.png" alt="Ngôi sao" /></div>
          </div>
        </div>
        <img id="wheelPointer" class="pointer" src="assets/pointer.png" alt="" />
      </div>
      <img class="decor" src="assets/decor.png" alt="" />
      <div class="spin-area" id="spinBtn" role="button" tabindex="0" aria-label="Quay">
        <img class="spin-img" src="assets/bt-quay.png" alt="Quay" />
        <div class="badge" id="turns">99</div>
      </div>
      <div class="navs">
        <button class="pill" data-href="rules.html">Thể lệ</button>
        <button class="pill" data-href="missions.html">Thêm lượt</button>
        <button class="pill" data-href="gifts.html">Túi quà</button>
      </div>
      <div class="result-modal" id="resultModal" aria-hidden="true">
        <div class="result-backdrop"></div>
        <div class="result-card" role="dialog" aria-modal="true" aria-label="Kết quả vòng quay">
          <img class="result-bg" id="resultBg" src="assets/bg-qua.png" alt="" />
          <!-- Variant 1: Trúng Voucher -->
          <div class="result-body modal-win active" id="modalWin">
            <div class="result-sub-label">Bạn đã nhận được</div>
            <div class="result-voucher-val" id="resultVoucherVal">E-voucher 20.000 VNĐ</div>
            <div class="result-voucher-img-wrap">
              <img class="result-voucher-img" id="resultVoucherImg" src="assets/item-20k.png" alt="20K" />
            </div>
            <img class="result-burst" src="assets/bg-item.png" alt="" />
          </div>
          <!-- Variant 2 & 3: Lá may mắn / Ngôi sao -->
          <div class="result-body modal-lucky" id="modalLucky">
            <div class="result-lucky-burst-wrap">
              <img class="result-burst" src="assets/bg-item.png" alt="" />
              <img class="result-lucky-img" id="resultLuckyImg" src="assets/iteam-la.png" alt="" />
            </div>
            <div class="result-lucky-text" id="resultLuckyText">Chúc bạn may mắn lần sau</div>
          </div>
          <!-- Variant 4: Hết lượt quay / Rất tiếc -->
          <div class="result-body modal-out" id="modalOut">
            <div class="result-out-title">Bạn đã hết lượt quay</div>
            <div class="result-out-sub">Làm nhiệm vụ để nhận thêm lượt nhé!</div>
          </div>
          <button class="result-close" id="resultClose" aria-label="Đóng">
            <img src="assets/bt-close.png" alt="" />
          </button>
        </div>
      </div>
    </div>
    <audio id="bgmAudio" src="assets/nhacnen.mp3" loop preload="auto" playsinline autoplay></audio>
    <script src="app.js?v=20260915_audio6"></script>
    <script>VBB.home()</script>
  </body>

</html>
